<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Garden Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3a342c; --ivory: #fffaf2; --gold: #e2a52a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Karla', sans-serif; color: var(--ink);
    background: radial-gradient(circle at 10% 90%, rgba(111,214,160,0.35), transparent 60%),
                radial-gradient(circle at 90% 10%, rgba(255,220,77,0.35), transparent 60%),
                var(--ivory);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; text-align: center;
  }
  .eyebrow { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.6; margin-bottom: 8px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0 0 6px; }
  p.sub { margin: 0 0 18px; opacity: 0.75; max-width: 420px; }

  .palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; max-width: 560px; }
  .item-btn {
    width: 52px; height: 52px; border-radius: 12px; border: 2px solid transparent; cursor: pointer;
    background: white; display: flex; align-items: center; justify-content: center;
  }
  .item-btn svg { width: 28px; height: 28px; }
  .item-btn[aria-pressed="true"] { border-color: var(--gold); }
  .item-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; }
  .tool-btn {
    font-family: 'Karla', sans-serif; font-weight: 600; font-size: 13px;
    background: rgba(255,255,255,0.7); border: 1px solid rgba(58,52,44,0.15); border-radius: 999px;
    padding: 9px 18px; cursor: pointer;
  }
  .tool-btn:hover { background: white; }

  #canvas {
    position: relative; width: 100%; max-width: 640px; height: 380px; border-radius: 20px;
    background: linear-gradient(180deg, #eafaf1, #d7f2e2);
    box-shadow: 0 8px 24px rgba(58,52,44,0.12); cursor: crosshair; overflow: hidden;
  }
  .placed { position: absolute; width: 40px; height: 40px; transform: translate(-50%, -50%); cursor: pointer; }
  .placed svg { width: 100%; height: 100%; }
  #hint { margin-top: 14px; font-size: 13px; opacity: 0.65; max-width: 400px; }
</style>
</head>
<body>
  <span class="eyebrow">No goal, no score</span>
  <h1>Garden Builder</h1>
  <p class="sub">Pick something from the tray, then click anywhere on the plot to place it. Click a placed piece to remove it.</p>

  <div class="palette" id="palette"></div>
  <div class="toolbar">
    <button class="tool-btn" id="randomize-btn">Surprise me</button>
    <button class="tool-btn" id="clear-btn">Clear garden</button>
  </div>

  <div id="canvas" role="button" aria-label="Garden plot — click to place the selected item"></div>
  <p id="hint">Selected: Flower</p>

<script>
  var ITEMS = [
    { key: 'flower',  color: '#ff9dba', svg: '<circle cx="20" cy="14" r="7"/><circle cx="12" cy="22" r="7"/><circle cx="28" cy="22" r="7"/><circle cx="20" cy="28" r="7"/><circle cx="20" cy="20" r="5" fill="#3a342c"/>' },
    { key: 'tulip',    color: '#ffab6e', svg: '<path d="M20 6 C12 6 12 20 20 24 C28 20 28 6 20 6 Z"/><rect x="18" y="24" width="4" height="12"/>' },
    { key: 'bush',     color: '#6fd6a0', svg: '<circle cx="14" cy="20" r="9"/><circle cx="26" cy="20" r="9"/><circle cx="20" cy="14" r="9"/>' },
    { key: 'tree',     color: '#35b378', svg: '<rect x="17" y="24" width="6" height="12" fill="#7a5230"/><circle cx="20" cy="16" r="14"/>' },
    { key: 'mushroom', color: '#ff6f91', svg: '<path d="M8 18 C8 8 32 8 32 18 Z"/><rect x="16" y="18" width="8" height="14" fill="#fdf2e2"/>' },
    { key: 'stone',    color: '#b7a9ff', svg: '<ellipse cx="20" cy="24" rx="16" ry="9"/>' },
    { key: 'star',     color: '#ffdc4d', svg: '<path d="M20 4 L24 16 L36 16 L26 23 L30 35 L20 27 L10 35 L14 23 L4 16 L16 16 Z"/>' },
    { key: 'cloud',    color: '#4fd1c5', svg: '<ellipse cx="14" cy="22" rx="9" ry="7"/><ellipse cx="24" cy="20" rx="11" ry="9"/><ellipse cx="30" cy="24" rx="7" ry="6"/>' }
  ];

  var selected = ITEMS[0];
  var paletteEl = document.getElementById('palette');

  function makeSvg(item, size) {
    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="' + item.color + '">' + item.svg + '</svg>';
  }

  ITEMS.forEach(function (item) {
    var btn = document.createElement('button');
    btn.className = 'item-btn';
    btn.type = 'button';
    btn.setAttribute('aria-pressed', item.key === selected.key ? 'true' : 'false');
    btn.setAttribute('aria-label', item.key);
    btn.innerHTML = makeSvg(item);
    btn.addEventListener('click', function () {
      selected = item;
      document.querySelectorAll('.item-btn').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
      btn.setAttribute('aria-pressed', 'true');
      document.getElementById('hint').textContent = 'Selected: ' + item.key.charAt(0).toUpperCase() + item.key.slice(1);
    });
    paletteEl.appendChild(btn);
  });

  var canvas = document.getElementById('canvas');

  function placeItem(item, x, y) {
    var el = document.createElement('div');
    el.className = 'placed';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = makeSvg(item);
    el.title = 'Click to remove';
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      el.remove();
    });
    canvas.appendChild(el);
  }

  canvas.addEventListener('click', function (e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    placeItem(selected, x, y);
  });

  document.getElementById('clear-btn').addEventListener('click', function () {
    canvas.innerHTML = '';
  });

  document.getElementById('randomize-btn').addEventListener('click', function () {
    var rect = canvas.getBoundingClientRect();
    for (var i = 0; i < 14; i++) {
      var item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
      var x = Math.random() * (rect.width - 20) + 10;
      var y = Math.random() * (rect.height - 20) + 10;
      placeItem(item, x, y);
    }
  });
</script>
</body>
</html>
